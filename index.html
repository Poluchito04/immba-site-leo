<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>Fu Jen Catholic University International MBA (imMBA)</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;
--g:#0f4c5c;--g2:#1b6b7f;--acc:#ff9f68;--dark:#082a33;--tx:#14262b;--mut:#5a6f75;--w:#fff;--b:#f2f8f8;--b2:#d6ebec;--bd:#cfe2e4}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:200px}
body{margin:0;background:var(--w);color:var(--tx);font:16px/1.65 system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif}
a{color:var(--g);text-underline-offset:3px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--w);box-shadow:0 1px 0 var(--bd)}
/* 1 Top notice bar */
.notice{background:#082a33;color:#cfe6e8;font-size:13px;padding:7px 20px;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;text-align:center}
.who{font-weight:700;color:#ff9f68}
.notice a{font-weight:700;color:#fff}
.sep{opacity:.35}
.cm{border:1px solid #8ec3c9;background:var(--w);color:var(--tx);border-radius:999px;font-size:12px;padding:3px 12px;cursor:pointer;font-family:inherit}
.cm:hover{background:var(--b)}
/* 2 Branding */
.brand{max-width:1200px;margin:auto;padding:10px 20px;display:flex;align-items:center;gap:14px}
.brand svg{width:58px;height:58px;flex:none;filter:drop-shadow(0 4px 10px #082a3340);border-radius:14px}
.brand h1{font-family:"Palatino Linotype",Palatino,"Book Antiqua",serif;font-size:clamp(1rem,2.4vw,1.35rem);margin:0;color:var(--g);font-weight:650}
/* 3 Navigation + 4 Action */
.navrow{max-width:1200px;margin:auto;padding:2px 20px 10px;display:flex;align-items:flex-start;gap:14px}
.navrow[hidden]{display:none}
nav{flex:1}
nav ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:2px 4px}
nav a{display:block;padding:6px 10px;font-size:13.5px;color:var(--tx);text-decoration:none;border-radius:0;border-bottom:2px solid transparent}
nav a:hover,nav a.on{background:transparent;color:var(--g);border-bottom-color:#ff9f68}
nav li{position:relative}
nav li.has>a::after{content:" ▾";font-size:10px;opacity:.7}
.dd{display:none;position:absolute;top:100%;left:0;min-width:240px;background:var(--w);border:1px solid var(--bd);border-radius:10px;padding:6px;box-shadow:0 12px 28px #14262b22;z-index:40}
nav li:hover>.dd,nav li:focus-within>.dd,nav li.open>.dd{display:block}
.dd a{padding:9px 12px;font-size:14px;white-space:nowrap}
.subs{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-top:18px}
.sub{background:var(--w);border:1px solid var(--bd);border-top:4px solid #ff9f68;border-radius:12px;padding:22px;box-shadow:0 2px 8px #14262b0f}
.sub h4{margin:0 0 4px;color:var(--g)}
.sub p{margin:0 0 8px;color:var(--mut);font-size:.95rem}
.act{display:flex;gap:8px;align-items:center}
.lang{border:1px solid var(--bd);background:var(--w);color:var(--mut);border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer;font-family:inherit}
.lang:hover{background:var(--b)}
.btn{display:inline-block;background:var(--g);color:#fff;padding:9px 22px;border-radius:999px;font-weight:600;font-size:14px;text-decoration:none;border:1.5px solid var(--g);white-space:nowrap}
.btn:hover{background:var(--g2);border-color:var(--g2)}
.btn.o{background:var(--w);color:var(--g)}
.btn.o:hover{background:var(--b2)}
/* 5 Hero */
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#082a33 0%,#0f4c5c 55%,#1b6b7f 100%);text-align:left;padding:110px max(20px,calc(50% - 500px)) 90px}
.hero svg.bg{position:absolute;right:40px;top:50px;width:480px;opacity:.35;pointer-events:none}
.hero>*{position:relative}
.pill{display:inline-block;background:transparent;color:#ff9f68;border:1px solid #ff9f68;border-radius:999px;font-size:13px;font-weight:600;padding:4px 16px;margin-bottom:22px}
.hero h2{color:#fff!important;font-family:"Palatino Linotype",Palatino,"Book Antiqua",serif;font-size:clamp(2.4rem,7vw,4.4rem);line-height:1.05;margin:0 0 18px;color:var(--g);letter-spacing:-1.5px}
.hero h2 em{font-style:italic;color:#ff9f68}
.hero p{max-width:560px;margin:0 0 32px;color:#cfe6e8!important;color:var(--mut);font-size:1.1rem}
.hero .btn{padding:14px 32px;font-size:15px;background:#ff9f68;border-color:#ff9f68;color:#082a33;margin-right:8px}.hero .btn.o{background:transparent;color:#fff;border-color:#fff}.hero .btn.o:hover{background:#ffffff22}
.facts{display:flex;justify-content:flex-start;gap:10px 28px;flex-wrap:wrap;margin-top:40px;color:#cfe6e8;font-size:14px}
.facts span::before{content:"◆ ";color:#ff9f68;font-weight:700}
/* sections */
.wrap{max-width:1080px;margin:auto;padding:0 20px}
section{padding:64px 0}section h3{border-left:5px solid #ff9f68;padding-left:14px}
section:nth-of-type(even){background:var(--b)}
h3{font-family:"Palatino Linotype",Palatino,"Book Antiqua",serif;font-size:clamp(1.5rem,4vw,2rem);margin:0 0 10px;color:var(--g)}
.d{color:var(--mut);max-width:680px;margin:0 0 14px}
.list{list-style:none;padding:0;margin:0;max-width:760px}
.list li{background:var(--w);border:1px solid var(--bd);border-left:4px solid var(--g);border-radius:12px;margin-bottom:10px;box-shadow:0 2px 8px #14262b0f}
.list a{display:flex;justify-content:space-between;gap:12px;padding:12px 16px;color:var(--tx);text-decoration:none}
.list a:hover{color:var(--g)}
.list time{color:var(--mut);font-size:13px;white-space:nowrap}
/* announcement cards */
.ncards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px;margin:18px 0 14px}
.ncard{display:flex;flex-direction:column;background:var(--w);border:1px solid var(--bd);border-radius:12px;padding:18px;box-shadow:0 2px 8px #14262b0f;cursor:pointer;transition:transform .2s,box-shadow .2s,border-color .2s}
.ncard:hover,.ncard:focus-within{transform:translateY(-6px);box-shadow:0 14px 30px #14262b2e;border-color:var(--g)}
.ncard time{font-size:13px;color:var(--mut);font-weight:600}
.ncard .top{display:inline-block;background:var(--acc);color:var(--dark);font-size:11px;font-weight:800;border-radius:999px;padding:1px 9px;margin-left:8px;letter-spacing:.04em}
.ncard h4{margin:6px 0 8px;font:700 1.05rem/1.35 "Palatino Linotype",Palatino,serif;color:var(--g)}
.ncard p{margin:0 0 14px;color:var(--mut);font-size:14px;flex:1}
.ncard a{align-self:flex-start;font-weight:700;font-size:14px;text-decoration:none;border-bottom:2px solid var(--acc)}
.ncard a::after{content:" ↗"}
.more{margin-top:6px}
.src{font-size:13px;color:var(--mut);margin:0}
.brand a.lg{display:flex;border-radius:12px}.brand a.lg:hover svg{filter:drop-shadow(0 2px 6px #0f4c5c66)}
footer{background:#082a33;color:#cfe6e8;text-align:center;padding:26px 20px;font-size:14px}
footer a{color:#fff}
@media(max-width:700px){.navrow{flex-direction:column}.act{width:100%}.hero svg.bg{width:340px}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<symbol id="logo" viewBox="0 0 64 64">

<rect width="64" height="64" rx="15" fill="url(#bg)"/>
<rect width="64" height="64" rx="15" fill="url(#sh)"/>
<circle cx="32" cy="32" r="16" fill="none" stroke="#fff" stroke-width="3.2" stroke-opacity=".92"/>
<circle cx="32" cy="24.3" r="2.9" fill="#ff9f68"/>
<rect x="29.6" y="29.6" width="4.8" height="11.4" rx="2.4" fill="#fff"/>

</symbol>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a8aa0"/><stop offset="1" stop-color="#082a33"/></linearGradient>
<linearGradient id="sh" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/></linearGradient>
</defs>
